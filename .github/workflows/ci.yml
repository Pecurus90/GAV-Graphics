name: CI portatile — R9 su Windows + macOS

# Trigger: manuale (workflow_dispatch, disponibile quando il file e' su main) e
# push di un tag. NON su ogni push: il runner macOS costa 10x (D4/#8 M2/B1).
on:
  workflow_dispatch:
  push:
    tags:
      - 'ci-*'
      - 'v*'

jobs:
  test:
    name: ${{ matrix.os }} · py3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # voglio il risultato di ENTRAMBI gli OS, non fermarmi al primo rosso
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dipendenze pinnate (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Versioni effettive (per il confronto cross-OS)
        run: pip freeze

      - name: Suite (il golden a TOLLERANZA collaudato cross-OS)
        run: python -m pytest -q

      # PROVA DI R9 sul runner: se resvg (.pyd/.dylib) o de421 non caricassero,
      # o i font non si trovassero, questo passo fallirebbe.
      # !cancelled(): la PROVA di R9 (render su Mac) gira ANCHE se la suite e'
      # rossa, cosi' la risposta R9 non resta ostaggio di un test fallito altrove.
      - name: Rendi un PNG col CLI
        if: ${{ !cancelled() }}
        run: python cielo.py --year 2026 --month 8 --format dashboard --png --out out/ci_post.svg

      - name: Asserisci che il PNG sia VERO (esiste, PNG valido, > 50 KB, 1080x1350)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, struct
          p = os.path.join("out", "ci_post.png")
          assert os.path.exists(p), f"PNG mancante: {p}"
          size = os.path.getsize(p)
          head = open(p, "rb").read(24)
          assert head[:8] == b"\x89PNG\r\n\x1a\n", "non e' un PNG valido"
          w, h = struct.unpack(">II", head[16:24])
          print(f"PNG: {size} bytes, {w}x{h}")
          assert size > 50_000, f"PNG sospettosamente piccolo ({size} B): resvg/font da guardare"
          assert (w, h) == (1080, 1350), f"dimensioni inattese: {w}x{h}"

      # Sempre: cosi' posso SCARICARE e GUARDARE il PNG anche se l'assert fallisce
      # (un PNG da 2 KB o coi font di sistema e' un fallimento, non un successo).
      - name: Carica il PNG come artefatto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci_post-${{ matrix.os }}
          path: out/ci_post.png
          if-no-files-found: warn
